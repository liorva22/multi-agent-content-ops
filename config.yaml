# Model per agent + list prices (USD per million tokens), checked 2026-10-16.
agents:
  researcher: {model: claude-sonnet-5-5, input_per_mtok: 2.00, output_per_mtok: 10.00, effort: medium}
  writer:     {model: claude-sonnet-5-5, input_per_mtok: 2.00, output_per_mtok: 10.00, effort: medium}
  fact_checker: {model: claude-opus-5-5, input_per_mtok: 4.00, output_per_mtok: 20.00, effort: high}
  polisher:   {model: claude-haiku-5-5, input_per_mtok: 0.10, output_per_mtok: 0.50, effort: low}
  judge:      {model: claude-sonnet-5-5, input_per_mtok: 2.00, output_per_mtok: 10.00, effort: low}

# Writer attempts before a run is escalated to human review (1 = no retries).
max_write_attempts: 3

rubric:
  min_words: 250
  max_words: 1000
  min_sections: 3
  min_reading_ease: 30   # Flesch reading ease; ~30-50 is typical for tech blog prose
