[project]
name = "multi-agent-content-ops"
version = "1.0.0"
description = "PRD -> Researcher -> Writer -> Fact-checker -> Polisher, with rollback on failed fact-checks and per-step logging."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contentops"]

[tool.setuptools.package-data]
contentops = ["static/*.html"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
